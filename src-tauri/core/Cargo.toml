[package]
name = "ccs-core"
version = "0.3.0"
license = "AGPL-3.0-only"
edition = "2021"
description = "Shared by the cc-slaves app and menu bar: engine.json, LaunchAgents, Keychain token, engine client"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
